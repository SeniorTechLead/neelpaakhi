<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 340" fill="none">
  <defs>
    <linearGradient id="fg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#00e0ff"/>
      <stop offset="12%" stop-color="#22ccf2"/>
      <stop offset="30%" stop-color="#2098d4"/>
      <stop offset="50%" stop-color="#186a9c"/>
      <stop offset="70%" stop-color="#103860"/>
      <stop offset="90%" stop-color="#0a2040"/>
      <stop offset="100%" stop-color="#061020"/>
    </linearGradient>
    <!-- Clip everything to feather shape -->
    <clipPath id="feather-clip">
      <path d="
        M 100 330
        C 97 305, 90 270, 82 240
        C 72 205, 60 170, 52 140
        C 42 108, 38 78, 46 55
        C 52 38, 66 24, 84 15
        C 98 8, 114 10, 128 20
        C 138 28, 140 38, 135 48
        C 128 62, 120 80, 114 100
        C 108 122, 106 148, 104 175
        C 102 208, 102 250, 100 290
        C 100 305, 100 318, 100 330
        Z
      "/>
    </clipPath>
  </defs>

  <!-- Feather body -->
  <path d="
    M 100 330
    C 97 305, 90 270, 82 240
    C 72 205, 60 170, 52 140
    C 42 108, 38 78, 46 55
    C 52 38, 66 24, 84 15
    C 98 8, 114 10, 128 20
    C 138 28, 140 38, 135 48
    C 128 62, 120 80, 114 100
    C 108 122, 106 148, 104 175
    C 102 208, 102 250, 100 290
    C 100 305, 100 318, 100 330
    Z
  " fill="url(#fg)"/>

  <!-- All veins clipped inside feather -->
  <g clip-path="url(#feather-clip)">
    <!-- Rachis — dark central spine, curves slightly right near top -->
    <path d="
      M 100 330
      C 98 295, 95 255, 92 220
      C 88 185, 84 150, 80 120
      C 76 92, 72 68, 72 50
      C 74 36, 82 24, 96 16
    " stroke="#050e18" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- Left barb veins — sweep from rachis outward-left -->
    <path d="M 98 290 Q 82 282 72 288" stroke="#0a1828" stroke-width="1.1" fill="none" opacity="0.35"/>
    <path d="M 95 260 Q 76 250 64 256" stroke="#0a1828" stroke-width="1.2" fill="none" opacity="0.4"/>
    <path d="M 92 230 Q 72 218 58 222" stroke="#0a1828" stroke-width="1.2" fill="none" opacity="0.4"/>
    <path d="M 88 200 Q 66 186 52 190" stroke="#0a1828" stroke-width="1.2" fill="none" opacity="0.42"/>
    <path d="M 84 170 Q 62 154 48 156" stroke="#0a1828" stroke-width="1.3" fill="none" opacity="0.45"/>
    <path d="M 80 140 Q 58 124 44 124" stroke="#0a1828" stroke-width="1.3" fill="none" opacity="0.45"/>
    <path d="M 77 112 Q 58 96  42 94"  stroke="#0a1828" stroke-width="1.2" fill="none" opacity="0.42"/>
    <path d="M 74 86  Q 58 72  46 68"  stroke="#0a1828" stroke-width="1.1" fill="none" opacity="0.38"/>
    <path d="M 72 62  Q 60 50  50 48"  stroke="#0a1828" stroke-width="1" fill="none" opacity="0.32"/>

    <!-- Right barb veins — shorter -->
    <path d="M 95 260 Q 102 256 106 250" stroke="#0a1828" stroke-width="0.9" fill="none" opacity="0.28"/>
    <path d="M 92 230 Q 100 224 106 218" stroke="#0a1828" stroke-width="0.9" fill="none" opacity="0.28"/>
    <path d="M 88 200 Q 98 192 106 184" stroke="#0a1828" stroke-width="0.9" fill="none" opacity="0.28"/>
    <path d="M 84 170 Q 96 160 108 150" stroke="#0a1828" stroke-width="0.9" fill="none" opacity="0.28"/>
    <path d="M 80 140 Q 94 128 110 118" stroke="#0a1828" stroke-width="0.9" fill="none" opacity="0.25"/>
    <path d="M 77 112 Q 92 98  114 88"  stroke="#0a1828" stroke-width="0.8" fill="none" opacity="0.22"/>
    <path d="M 74 86  Q 90 72  120 58"  stroke="#0a1828" stroke-width="0.8" fill="none" opacity="0.2"/>
  </g>
</svg>
